[project]
name = "lithox"
version = "0.1.0"
description = "High performance jax-based photolithography simulation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Thomas Hirtz", email = "thomas.hirtz@pm.me" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]

dependencies = [
  "jax>=0.8.0,!=0.7.0,!=0.7.1",
  "numpy",
  "equinox>=0.13.0",
  "jaxtyping",
  "Pillow",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lithox*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
  "requests>=2.31",
  # "torch",
]

# tests/data/*.png are dev-only regression assets (not shipped in the wheel).

[tool.setuptools.package-data]
"lithox" = [
  "kernels/*.npy",
  "scales/*.npy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]